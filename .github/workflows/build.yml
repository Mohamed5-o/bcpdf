name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlackClover-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

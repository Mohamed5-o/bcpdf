name: Build Release APK
on:
  push:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release
        run: gradle assembleRelease --stacktrace 2>&1 | tee build-release.log; test ${PIPESTATUS[0]} -eq 0
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlackClover-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-log
          path: build-release.log
